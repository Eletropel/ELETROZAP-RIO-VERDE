<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eletropel • Central WhatsApp</title><link rel="stylesheet" href="style.css"></head><body><header><div class="brand">Eletropel</div><div><strong>Central de Convites</strong><small>Inauguração Rio Verde</small></div><div class="spacer"></div><label class="file">Importar Excel/CSV<input id="file" type="file" accept=".xlsx,.xls,.csv"></label></header><main><section class="stats"><div><b id="total">0</b><span>Total</span></div><div><b id="pending">0</b><span>Pendentes</span></div><div><b id="sent">0</b><span>Enviados</span></div><div><b id="errors">0</b><span>Erros</span></div></section><section class="grid"><div class="card current"><div class="eyebrow">CLIENTE ATUAL</div><h1 id="name">Nenhum cliente carregado</h1><div id="phone" class="phone">—</div><textarea id="message" placeholder="Mensagem..." spellcheck="false"></textarea><div class="actions"><button id="open" class="primary">ABRIR WHATSAPP</button><button id="sentBtn" class="success">✓ ENVIADO</button><button id="skipBtn" class="ghost">PULAR</button></div><div class="hint">A extensão do Chrome prepara a imagem + legenda no WhatsApp. O envio final continua manual: pressione Enter.</div></div><div class="card preview"><div class="eyebrow">CONVITE</div><img src="assets/convite.png" alt="Convite Eletropel"><div class="progress"><div id="bar"></div></div><div id="progressText">0 / 0</div></div></section><section class="card queue"><div class="queueHead"><div><div class="eyebrow">FILA</div><h2>Clientes</h2></div><input id="search" placeholder="Pesquisar cliente ou telefone"></div><div id="list"></div></section></main><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="script.js"></script></body></html>
